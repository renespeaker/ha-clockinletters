name: Release

# Automatisch: Sobald auf main eine neue CARD_VERSION in clockinletters-card.js
# steht, für die es noch kein Release gibt, wird der Tag v<Version> angelegt
# und ein Release mit der Karten-Datei erstellt (Text aus CHANGELOG.md).
on:
  push:
    branches: [main]
    paths:
      - clockinletters-card.js
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version lesen
        id: version
        run: |
          VERSION=$(grep -oP 'const CARD_VERSION = "\K[^"]+' clockinletters-card.js)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Release v$VERSION gibt es schon – nichts zu tun."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Neue Version v$VERSION"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prüfen
        if: steps.version.outputs.exists == 'false'
        run: |
          node --check clockinletters-card.js
          node tests/time.test.js

      - name: Release-Notizen aus CHANGELOG.md
        if: steps.version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Version $VERSION" > notes.md
          cat notes.md

      - name: Tag und Release anlegen
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: clockinletters-card.js
