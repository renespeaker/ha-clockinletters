name: Prüfen

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  javascript:
    name: Karte prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax prüfen
        run: node --check clockinletters-card.js
      - name: Zeitlogik testen
        run: node tests/time.test.js

  hacs:
    name: HACS-Validierung
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          # Nicht nötig für ein benutzerdefiniertes Repository
          ignore: brands topics description
